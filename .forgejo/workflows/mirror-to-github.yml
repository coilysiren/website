name: Test and mirror to GitHub

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: test-and-mirror-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and run the quick test gate
        run: bash scripts/ci/run-in-container.sh test

  test-e2e:
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Cypress smoke tests
        run: bash scripts/ci/run-in-container.sh e2e

  mirror:
    needs: [test, test-e2e]
    runs-on: deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mirror canonical history to GitHub
        env:
          PAT: ${{ secrets.GITHUB_MIRROR_PAT }}
        run: bash scripts/ci/mirror-to-github.sh
