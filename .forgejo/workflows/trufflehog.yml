name: TruffleHog

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: website-deploy-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog (git, offline)
        run: bash scripts/ci/run-in-container.sh scan
