name: Daily release sync

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: website-deploy-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Fast-forward GitHub release to main
    runs-on: deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - name: Push main to the GitHub release branch
        env:
          PAT: ${{ secrets.GITHUB_MIRROR_PAT }}
        run: bash scripts/ci/sync-release-branch.sh
      - name: Alert Telegram on failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/alert-telegram.py
