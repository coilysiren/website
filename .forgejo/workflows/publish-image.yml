name: Publish staging image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: website-deploy-runner
  cancel-in-progress: false

jobs:
  publish:
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable website image
        run: bash scripts/publish-image.sh
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/alert-telegram.py
