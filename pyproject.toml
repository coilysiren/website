# Config-only pyproject: this is a JavaScript site, and the file exists so the
# agentic-os catalog hooks have somewhere to read per-repo settings from.

[tool.agentic-os.documentation-layout]
# Declared rather than defaulted: an undeclared repo and a deliberately
# small one were the same file, and only one had the decision made.
band = "small"
# Published site content is the product, not repository documentation, so the
# docs layout and size caps do not model it. A post is as long as its argument
# needs and lives where Eleventy's permalink computation expects it. Same hatch
# agentic-os takes for internal/person/data. .github templates follow GitHub's
# required layout, and drafts/ is unpublished prose. The caps still bind
# README.md, AGENTS.md, and docs/*.md, which is where they were aimed.
excludes = [
    ".github/ISSUE_TEMPLATE/**",
    "drafts/**",
    "src/pages/**",
    "src/projects/docs/**",
]

[tool.agentic-os.dead-cross-links]
# Mounted docs are vendored verbatim, so their links are correct relative to
# the repo that owns them and resolve to nothing relative to this one. The
# Eleventy `mountedDocLinks` transform rewrites them at render, pointing an
# unmounted target back at the file in its own repo. Enforcing another repo's
# link hygiene here would mean editing vendored content, which is the one
# thing verbatim mounting exists to prevent. See coilysiren/inbox#438.
# src/pages/** carries site URLs like /resume.pdf, which are correct for the
# server and resolve outside the repo on disk. Same hatch documentation-layout
# already takes for that directory.
excludes = ["src/pages/**", "src/projects/docs/**"]
