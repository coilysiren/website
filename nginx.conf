server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location ~ ^/(?:now|life|my-life)/?$ {
    return 301 /about/;
  }

  location ~ ^/posts/agent-launch-pillars/?$ {
    return 301 /;
  }

  location ~ ^/posts/2019-12-25-golang-pr-field-notes-part-1/?$ {
    return 301 /posts/golang-pr-notes-1/;
  }

  location ~ ^/posts/2019-12-26-golang-pr-field-notes-part-2/?$ {
    return 301 /posts/golang-pr-notes-2/;
  }

  location ~ ^/posts/2019-12-29-golang-pr-field-notes-part-3/?$ {
    return 301 /posts/golang-pr-notes-3/;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location ~* \.(?:css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
